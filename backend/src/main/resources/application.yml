spring:
  application:
    name: seatsense
  # Reads POSTGRES_* from the repo-root .env when the backend runs from backend/. Optional, so CI and tests work without it.
  config:
    import: optional:file:../.env[.properties]
  profiles:
    default: local
    group:
      dev: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    # Shefali numbers migrations odd and Bhavyam even, so a lower number can land after a higher one
    # (V2 after V4). Without this, Flyway refuses to start on a database that already has the higher one.
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health

seatsense:
  # The library's time zone. Every "now" goes through TimeProvider, which uses this.
  time-zone: Asia/Kolkata
  # Pages allowed to open the /ws socket. The Vite dev server (port 5173) and the backend itself.
  # shortcut: localhost only; add the demo laptop's address when hosting is decided (B3.2).
  ws-allowed-origins: http://localhost:[*],http://127.0.0.1:[*]

---
# local: your own machine, Postgres from docker-compose.yml.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:seatsense}
    username: ${POSTGRES_USER:seatsense}
    password: ${POSTGRES_PASSWORD}

---
# dev: local plus demo-only features (simulator endpoints, B3.1). Never use it on a server with real data.
spring:
  config:
    activate:
      on-profile: dev

---
# cloud: the hosted demo (B3.2, Dockerfile and render.yaml). Sample data only.
# The database and the public address come from the host's environment.
spring:
  config:
    activate:
      on-profile: cloud
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
server:
  port: ${PORT:8080}
  # Render ends HTTPS at its proxy; trust its X-Forwarded-* headers so the app knows it is on https.
  forward-headers-strategy: framework
seatsense:
  # Render sets RENDER_EXTERNAL_URL to the service's https address.
  ws-allowed-origins: ${RENDER_EXTERNAL_URL:http://localhost:[*]}

---
# test: integration tests. The database comes from Testcontainers (see PostgresIntegrationTest).
spring:
  config:
    activate:
      on-profile: test
logging:
  level:
    org.testcontainers: WARN
